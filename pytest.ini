[pytest]
# A warning that is not this repository's. scikit-image 0.26.0's
# morphology.reconstruction, which rule E5 and one unit test call, sets an
# array's shape, which NumPy 2.5 deprecates (RUNBOOK, Stage 3, If it fails).
# Only that message from that module is ignored; once NumPy removes the
# setter, the call fails with an error, which no filter hides. Remove this
# when a scikit-image release no longer sets the shape.
filterwarnings =
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:skimage\.morphology\.grayreconstruct
