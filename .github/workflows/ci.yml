name: ci

# Unit tests on every push, plus a weekly run, as in grid-carbon-intensity.
# The matrix tests the ends: 3.11 is the oldest version this project claims
# to support, 3.14 the one it is developed on. requirements.txt pins nothing,
# so a red Monday run with no commits means the ecosystem moved, not the code.
#
# Deliberately NOT in CI: the three pulls. A build must not depend on
# figshare, the Thünen Atlas or The National Map being up; the tests replace
# every request.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"    # Mondays 06:23 UTC

jobs:
  tests:
    name: unit tests
    # Pinned rather than ubuntu-latest, as in grid-carbon-intensity, so that a
    # red build means this code broke, not that the runner image changed.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q

  windows:
    name: unit tests, Windows, from the lock file
    # Where the results are produced: Windows and Python 3.14, the versions
    # requirements-lock.txt pins (uv pip compile --universal).
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-lock.txt
      - name: pytest
        run: python -m pytest -q

  gstat:
    name: rule G1, gstat in R
    # RUNBOOK, Stage 5, D7: gstat krigs IL-RT's cells and field mean from
    # tests/fixtures/gstat_IL-RT.json, and this repository's code the same.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-gstat r-cran-sp r-cran-jsonlite
      - run: pip install -r requirements-lock.txt
      - name: G1
        run: python -m src.checks.gstat
